<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Regression Calculator</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 40px;
        }
        input {
            text-align: center;
            padding: 5px;
            margin-top: 5px;
            width: 250px;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Linear Regression Calculator</h2>
    
    <div>
        <p>Enter X Values (comma-separated):</p>
        <input type="text" id="xValues" placeholder="e.g., 1, 2, 3, 4">
    </div>

    <div>
        <p>Enter Y Values (comma-separated):</p>
        <input type="text" id="yValues" placeholder="e.g., 2, 3, 5, 4">
    </div>

    <br>
    <div style="display: flex; justify-content: center; gap: 10px;">
        <button onclick="calculateRegression()">Calculate</button>
        <button id="resetBtn" style="display:none;" onclick="reset()">Reset</button>
    </div>

    <div id="result" style="display: none;"></div>
    
    <br>

    <button
        id="visualizeBtn"
        style="display:none;"
        onclick="visualizeGraph()">
        Visualize Graph
    </button>

    <br><br>

    <div id="plotDiv1" style="display:none;">
        <img
            id="graphImage"
            style="max-width:700px;width:100%;border:1px solid #ccc;">
    </div>
    <div id="plotDiv2" style="display:none;">
        <img
            id="metricImage"
            style="max-width:700px;width:100%;border:1px solid #ccc;">
    </div>



    <script>

        let graphX = [];
        let graphY = [];
        let m = 0, b = 0, mse = 0, mae = 0, rmse = 0, rSquared = 0;



        function calculateRegression() {
            const xInput = document.getElementById('xValues').value;
            const yInput = document.getElementById('yValues').value;

            const xTokens = xInput.split(',');
            const x = [];
            for (let i = 0; i < xTokens.length; i++) {
                const num = parseFloat(xTokens[i]);
                if (!isNaN(num)) x.push(num);
            }

            const yTokens = yInput.split(',');
            const y = [];
            for (let i = 0; i < yTokens.length; i++) {
                const num = parseFloat(yTokens[i]);
                if (!isNaN(num)) y.push(num);
            }

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            if (x.length === 0 || y.length === 0) {
                resultDiv.innerHTML = "Error: Please enter valid numbers.";
                return;
            }
            if (x.length !== y.length) {
                resultDiv.innerHTML = `Error: The number of items must match. (X has ${x.length}, Y has ${y.length})`;
                return;
            }

            const n = x.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;

            for (let i = 0; i < n; i++) {
                sumX += x[i];
                sumY += y[i];
                sumXY += (x[i] * y[i]);
                sumXX += (x[i] * x[i]);
            }

            const denominator = (n * sumXX - sumX * sumX);
            
            if (denominator === 0) {
                resultDiv.innerHTML = "Error: Cannot calculate regression (vertical line or identical X values).";
                return;
            }

            m = (n * sumXY - sumX * sumY) / denominator;
            b = (sumY - m * sumX) / n;


            const meanY = sumY / n;
            let sse = 0, sst = 0, maeSum = 0;
            for (let i = 0; i < n; i++) {
                const predY = m * x[i] + b;
                sse += Math.pow(y[i] - predY, 2);
                sst += Math.pow(y[i] - meanY, 2);
                maeSum += Math.abs(y[i] - predY);
            }
            
            mae = maeSum / n;
            mse = sse / n;
            rmse = Math.sqrt(mse);
            rSquared = sst !== 0 ? 1 - (sse / sst) : 1;

            resultDiv.innerHTML = `
                <hr>
                <style>
                    .result-table {
                        margin: 20px auto;
                        border-collapse: collapse;
                        width: 90%;
                        max-width: 700px;
                    }
                    .result-table th, .result-table td {
                        border: 1px solid #ccc;
                        padding: 10px;
                        text-align: center;
                    }
                    .result-table th {
                        background-color: #f8f9fa;
                    }
                </style>
                <table class="result-table">
                    <tr>
                        <th>Metric</th>
                        <th>Mathematical Formula</th>
                        <th>Value</th>
                    </tr>
                    <tr>
                        <td><strong>Equation</strong></td>
                        <td>Y = mX + b</td>
                        <td>Y = ${m.toFixed(4)}X + ${b.toFixed(4)}</td>
                    </tr>
                    <tr>
                        <td><strong>Slope (m)</strong></td>
                        <td>(nΣxy - ΣxΣy) / (nΣx² - (Σx)²)</td>
                        <td>${m.toFixed(4)}</td>
                    </tr>
                    <tr>
                        <td><strong>Y-Intercept (b)</strong></td>
                        <td>(Σy - mΣx) / n</td>
                        <td>${b.toFixed(4)}</td>
                    </tr>
                    <tr>
                        <td><strong>MAE</strong></td>
                        <td>(1/n) Σ|y - ŷ|</td>
                        <td>${mae.toFixed(4)}</td>
                    </tr>
                    <tr>
                        <td><strong>MSE</strong></td>
                        <td>(1/n) Σ(y - ŷ)²</td>
                        <td>${mse.toFixed(4)}</td>
                    </tr>
                    <tr>
                        <td><strong>RMSE</strong></td>
                        <td>√MSE</td>
                        <td>${rmse.toFixed(4)}</td>
                    </tr>
                    <tr>
                        <td><strong>R² Score</strong></td>
                        <td>1 - (SSE / SST)</td>
                        <td>${rSquared.toFixed(4)}</td>
                    </tr>
                </table>
            `;

            
            graphX = x;
            graphY = y;

            document.getElementById("visualizeBtn").style.display = "inline-block";
            document.getElementById("resetBtn").style.display = "inline-block";
        }


        async function visualizeGraph() {
            const response = await fetch("/visualize_regression", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    x: graphX,
                    y: graphY,
                    m : m,
                    b : b,
                    mse : mse,
                    mae : mae,
                    rmse : rmse,
                    r2 : rSquared
                })
            });

            const data = await response.json();

            document.getElementById("plotDiv1").style.display = "block";
            document.getElementById("plotDiv2").style.display = "block";

            document.getElementById("graphImage").src = data.image1 + "?t=" + new Date().getTime();
            document.getElementById("metricImage").src = data.image2 + "?t=" + new Date().getTime();
        }

        function reset() {
            document.getElementById("xValues").value = "";
            document.getElementById("yValues").value = "";
            document.getElementById("result").style.display = "none";
            document.getElementById("plotDiv1").style.display = "none";
            document.getElementById("plotDiv2").style.display = "none";
            document.getElementById("visualizeBtn").style.display = "none";
            document.getElementById("resetBtn").style.display = "none";
        }
    </script>

</body>
</html>
